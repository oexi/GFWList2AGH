name: Build & Release hezhijie0327/GFWList2AGH

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Step 1 - Checkout
              uses: actions/checkout@v7
            - name: Step 2 - Build GFWList2AGH
              run: |
                  bash release.sh
            - name: Step 3 - Release GFWList2AGH
              run: |
                  if [ -z "$(git status -s)" ]; then
                      echo "Oops! oexi/GFWList2AGH has no changes."
                      exit 0
                  fi
                  git config user.name "oexi"
                  git config user.email "83975611+oexi@users.noreply.github.com"
                  git add "."
                  git commit -m "Generated by GitHub Actions"
                  git push --force
